<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setback</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Setback (Auction Pitch) card game for phones.">
<meta name="theme-color" content="#0f2a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Setback">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231d5a40'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%23f5f0e4'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="setback.css?v=10">
<script src="firebase-config.js?v=10"></script>
</head>
<body>

<div id="screen" class="screen"></div>

<div id="app" hidden>

  <header class="top">
    <div class="scores">
      <div class="score-team">
        <span class="lbl" id="team0Lbl">E+W</span>
        <span class="pts" id="team0Score">0</span>
        <span class="side"><span class="games" id="team0Games">0</span><span class="sets" id="team0Sets">0</span></span>
      </div>
      <div class="score-team">
        <span class="lbl" id="team1Lbl">N+S</span>
        <span class="pts" id="team1Score">0</span>
        <span class="side"><span class="games" id="team1Games">0</span><span class="sets" id="team1Sets">0</span></span>
      </div>
    </div>
    <div class="contract" id="contract"></div>
    <button class="menu-btn chat-btn" id="chatBtn" aria-label="Chat" hidden>&#128172;<span class="badge" id="chatBadge" hidden></span></button>
    <button class="menu-btn" id="menuBtn" aria-label="Menu">&#8801;</button>
  </header>

  <div class="status" id="status"></div>

  <main class="table" id="table">
    <div class="seat pos-top" id="seatPos1"></div>
    <div class="seat pos-left" id="seatPos0"></div>
    <div class="seat pos-right" id="seatPos2"></div>
    <div class="trick" id="trick">
      <div class="slot slot-top" id="slotPos1"></div>
      <div class="slot slot-left" id="slotPos0"></div>
      <div class="slot slot-right" id="slotPos2"></div>
      <div class="slot slot-bottom" id="slotPos3"></div>
    </div>
    <div class="seat pos-bottom" id="seatPos3"></div>
    <div class="bid-panel" id="bidPanel" hidden></div>
    <div class="toast" id="toast" hidden></div>
  </main>

  <footer class="hand-area">
    <div class="coach" id="coach" hidden></div>
    <div class="prompt" id="prompt"></div>
    <div class="hand" id="hand"></div>
  </footer>

</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="chat" id="chat" hidden>
  <div class="chat-head"><span>Chat</span><button type="button" class="chat-close" id="chatClose" aria-label="Close chat">&#10005;</button></div>
  <div class="chat-list" id="chatList"></div>
  <div class="chat-quick" id="chatQuick"></div>
  <form class="chat-form" id="chatForm" autocomplete="off">
    <input id="chatInput" class="input" type="text" maxlength="200" placeholder="Message" enterkeyhint="send" autocomplete="off">
    <button type="submit" class="btn small" id="chatSend">Send</button>
  </form>
</div>

<noscript><p style="padding:1em;color:#fff">This game needs JavaScript.</p></noscript>
<script type="module" src="app.js?v=10"></script>
</body>
</html>
